<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#F2FAFF"/>
      <stop offset="1" stop-color="#EDF8F4"/>
    </linearGradient>
    <linearGradient id="c-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5FBFF"/>
    </linearGradient>
    <linearGradient id="c-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="c-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0F4257" flood-opacity=".12"/>
    </filter>
    <pattern id="c-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0F7EA0" stroke-opacity=".045"/>
    </pattern>
    <style>
      .title{font:800 52px "Fira Sans","PingFang SC",sans-serif;fill:#0B1720;letter-spacing:-2px}
      .sub{font:500 17px "Fira Sans","PingFang SC",sans-serif;fill:#56707B}
      .h2{font:750 24px "Fira Sans","PingFang SC",sans-serif;fill:#0B1720}
      .h3{font:700 17px "Fira Sans","PingFang SC",sans-serif;fill:#0B1720}
      .body{font:500 15px "Fira Sans","PingFang SC",sans-serif;fill:#58717B}
      .tiny{font:700 11px "Fira Code",monospace;fill:#0EA5A5;letter-spacing:2.2px}
      .num{font:800 42px "Fira Code",monospace;fill:#0B1720}
      .panel{fill:url(#c-panel);stroke:#CFE6EF;stroke-width:1;filter:url(#c-shadow)}
      .soft{fill:#F6FBFD;stroke:#D7E9EF;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#c-bg)"/>
  <rect width="1600" height="1000" fill="url(#c-grid)"/>
  <circle cx="1240" cy="90" r="260" fill="#49D8FF" opacity=".12"/>
  <circle cx="310" cy="850" r="260" fill="#20D39A" opacity=".11"/>

  <rect x="24" y="24" width="96" height="952" rx="28" fill="#FFFFFF" stroke="#DDEBF0" filter="url(#c-shadow)"/>
  <g transform="translate(52 58)">
    <rect width="40" height="40" rx="12" fill="url(#c-accent)"/>
    <path d="M12 25l7-9 6 5 8-14" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(58 150)" fill="none" stroke="#6A838D" stroke-width="3">
    <rect width="28" height="28" rx="8"/><path d="M7 10h14M7 18h14"/>
    <g transform="translate(0 72)"><circle cx="14" cy="14" r="12"/><path d="M14 7v8l6 4"/></g>
    <g transform="translate(0 144)"><path d="M4 24l10-19 10 19z"/></g>
    <g transform="translate(0 216)"><rect width="28" height="28" rx="7"/><path d="M7 19l5-5 4 3 6-8"/></g>
    <g transform="translate(0 288)"><circle cx="14" cy="14" r="12"/><path d="M8 14h12"/></g>
  </g>

  <g transform="translate(168 62)">
    <text class="tiny">LIGHT TECH WORKBENCH</text>
    <text y="58" class="title">PlayTest 测试实验台</text>
    <text y="92" class="sub">白色主界面、低边框、清晰信息层级，适合长时间编写和分析测试路径</text>
  </g>
  <g transform="translate(1210 62)">
    <rect width="250" height="54" rx="16" fill="#FFFFFF" stroke="#D7E9EF" filter="url(#c-shadow)"/>
    <circle cx="30" cy="27" r="8" fill="#10B981"/>
    <text x="52" y="33" class="body">默认亮色 · 跟随系统可切换</text>
  </g>

  <g transform="translate(168 152)">
    <rect width="420" height="226" rx="22" class="panel"/>
    <text x="26" y="42" class="tiny">PROJECT SIGNAL</text>
    <text x="26" y="92" class="num">74%</text>
    <text x="154" y="84" class="body">关键路径覆盖率</text>
    <rect x="28" y="128" width="350" height="12" rx="6" fill="#E2EEF3"/>
    <rect x="28" y="128" width="258" height="12" rx="6" fill="url(#c-accent)"/>
    <text x="28" y="176" class="h3">数据看板项目</text>
    <text x="28" y="204" class="body">图表、表格、筛选、导出、权限角色正在持续补齐</text>
  </g>
  <g transform="translate(616 152)">
    <rect width="410" height="226" rx="22" class="panel"/>
    <text x="26" y="42" class="tiny">NATURAL LANGUAGE</text>
    <text x="26" y="84" class="h2">自然语言命令</text>
    <rect x="26" y="112" width="358" height="78" rx="16" class="soft"/>
    <text x="46" y="146" class="body">验证趋势图加载完成，并提取表格首行客户名称</text>
    <rect x="272" y="26" width="98" height="38" rx="12" fill="url(#c-accent)" opacity=".15"/>
    <text x="294" y="50" class="h3">执行</text>
  </g>
  <g transform="translate(1054 152)">
    <rect width="390" height="226" rx="22" class="panel"/>
    <text x="26" y="42" class="tiny">RUN HEALTH</text>
    <text x="26" y="84" class="h2">运行健康度</text>
    <g transform="translate(32 116)">
      <circle cx="48" cy="48" r="46" fill="none" stroke="#E2EEF3" stroke-width="12"/>
      <path d="M48 2a46 46 0 1 1-42 64" fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round"/>
      <text x="112" y="42" class="num" font-size="32">86%</text>
      <text x="112" y="74" class="body">本周通过率</text>
    </g>
  </g>

  <g transform="translate(168 414)">
    <rect width="498" height="416" rx="22" class="panel"/>
    <text x="28" y="46" class="tiny">CASE WORKBENCH</text>
    <text x="28" y="88" class="h2">用例编排</text>
    <g transform="translate(28 122)">
      <rect width="438" height="64" rx="16" class="soft"/>
      <rect x="18" y="18" width="28" height="28" rx="8" fill="#DFF8F2"/>
      <text x="62" y="28" class="h3">01 打开数据看板</text>
      <text x="62" y="50" class="body">Navigate · 等待图表容器出现</text>
    </g>
    <g transform="translate(28 206)">
      <rect width="438" height="64" rx="16" class="soft"/>
      <rect x="18" y="18" width="28" height="28" rx="8" fill="#E4F3FF"/>
      <text x="62" y="28" class="h3">02 筛选最近 30 天</text>
      <text x="62" y="50" class="body">Action · 时间范围和业务线筛选</text>
    </g>
    <g transform="translate(28 290)">
      <rect width="438" height="64" rx="16" class="soft"/>
      <rect x="18" y="18" width="28" height="28" rx="8" fill="#FFF3D7"/>
      <text x="62" y="28" class="h3">03 断言图表与表格</text>
      <text x="62" y="50" class="body">Assert · 趋势数据和表格总量一致</text>
    </g>
  </g>

  <g transform="translate(696 414)">
    <rect width="360" height="416" rx="22" class="panel"/>
    <text x="26" y="46" class="tiny">BROWSER PREVIEW</text>
    <text x="26" y="88" class="h2">浏览器预览</text>
    <rect x="26" y="118" width="308" height="184" rx="18" fill="#F5FAFC" stroke="#D7E9EF"/>
    <rect x="48" y="142" width="140" height="18" rx="9" fill="#BEEFE5"/>
    <rect x="48" y="178" width="244" height="86" rx="14" fill="#FFFFFF" stroke="#E1EEF2"/>
    <path d="M62 238c36-42 72 6 108-30s74-4 102-36" fill="none" stroke="#0EA5E9" stroke-width="4"/>
    <text x="26" y="348" class="body">截图、Trace、Console 日志作为运行证据链自动挂载。</text>
  </g>

  <g transform="translate(1086 414)">
    <rect width="358" height="416" rx="22" class="panel"/>
    <text x="26" y="46" class="tiny">PRD TO TEST</text>
    <text x="26" y="88" class="h2">PRD 生成路径</text>
    <g transform="translate(26 124)">
      <rect width="306" height="68" rx="16" class="soft"/>
      <text x="18" y="30" class="h3">趋势图筛选</text>
      <text x="18" y="52" class="body">P0 · 图表展示</text>
    </g>
    <g transform="translate(26 212)">
      <rect width="306" height="68" rx="16" class="soft"/>
      <text x="18" y="30" class="h3">表格排序导出</text>
      <text x="18" y="52" class="body">P1 · 明细表格</text>
    </g>
    <g transform="translate(26 300)">
      <rect width="306" height="68" rx="16" class="soft"/>
      <text x="18" y="30" class="h3">角色数据隔离</text>
      <text x="18" y="52" class="body">P0 · 权限验证</text>
    </g>
  </g>
</svg>
